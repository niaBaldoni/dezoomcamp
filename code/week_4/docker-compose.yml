version: '3.8'

services:
  dbt:
    build: .
    container_name: dbt-duckdb
    volumes:
      # Mount the taxi_rides_ny project directory from YOUR local clone
      # IMPORTANT: Update the path on the left to YOUR actual path!
      # Example: /home/nia/data-engineering-zoomcamp/04-analytics-engineering/taxi_rides_ny
      - ~/data-engineering-zoomcamp/04-analytics-engineering/taxi_rides_ny:/workspace/taxi_rides_ny
      # Persist the dbt profiles (will be created automatically)
      - ./dbt_profile:/workspace/.dbt
    working_dir: /workspace/taxi_rides_ny
    stdin_open: true
    tty: true
    environment:
      - DBT_PROFILES_DIR=/workspace/.dbt
    # Keep container running so you can exec into it
    command: tail -f /dev/null
